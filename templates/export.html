{% extends "base.html" %}
{% block title %}导出数据 - 数据分析系统{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            {% if error %}
            <div class="alert alert-warning">
                ⚠️ {{ error }} — <a href="/" class="alert-link">前往上传</a>
            </div>
            {% else %}
            <div class="card shadow">
                <div class="card-header bg-info text-white">
                    <h4 class="mb-0">⬇ 导出数据</h4>
                </div>
                <div class="card-body">
                    <p>当前文件：<strong>{{ filename }}</strong></p>
                    <p>可选列：<small class="text-muted">{{ columns | join(', ') }}</small></p>

                    <form id="export-form">
                        <div class="mb-3">
                            <label class="form-label">选择导出格式：</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="format" value="csv" checked>
                                <label class="form-check-label">CSV（通用表格格式）</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="format" value="excel">
                                <label class="form-check-label">Excel（.xlsx）</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="format" value="json">
                                <label class="form-check-label">JSON（结构化数据格式）</label>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-info btn-lg" id="export-btn">
                            ⬇ 开始导出
                        </button>
                        <span id="export-status" class="ms-3"></span>
                    </form>
                </div>
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('export-form').addEventListener('submit', function(e) {
    e.preventDefault();

    const btn = document.getElementById('export-btn');
    const status = document.getElementById('export-status');
    btn.disabled = true;
    status.innerHTML = '<span class="text-muted">正在导出...</span>';

    const format = document.querySelector('input[name="format"]:checked').value;
    const formData = new FormData();
    formData.append('format', format);

    fetch('/export/download', { method: 'POST', body: formData })
        .then(response => {
            if (!response.ok) {
                return response.json().then(data => {
                    throw new Error(data.message || '导出失败');
                });
            }
            return response.blob();
        })
        .then(blob => {
            // 触发浏览器下载
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const ext = format === 'excel' ? 'xlsx' : format;
            a.download = 'exported_data.' + ext;
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(url);

            status.innerHTML = '<span class="text-success">✅ 导出成功！</span>';
            btn.disabled = false;
        })
        .catch(err => {
            status.innerHTML = '<span class="text-danger">❌ ' + err.message + '</span>';
            btn.disabled = false;
        });
});
</script>
{% endblock %}
