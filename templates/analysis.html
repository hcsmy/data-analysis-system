<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
</head>
<body class="container mt-4">
    <h3>数据聚类分析（K-Means）</h3>
    <form method="post" class="my-3">
        <label>输入聚类分组数量K：</label>
        <input type="number" name="k_value" value="3" min="2" max="10" class="form-control w-25 d-inline">
        <button type="submit" class="btn btn-primary ms-3">开始聚类分析</button>
        <a href="/?path={{path}}" class="btn btn-secondary">返回首页</a>
        <a href="/export?path={{path}}" class="btn btn-success">导出聚类后数据</a>
    </form>

    {% if sil_score %}
        <div class="alert alert-info">
            <h5>聚类效果：轮廓系数 = {{sil_score}}（越接近1，聚类效果越好）</h5>
            <p>分组样本数量：{{group_info}}</p>
        </div>
        <!-- 肘部法则曲线图 -->
        <div id="elbowChart" style="width:100%;height:350px;"></div>
        <!-- 聚类结果表格 -->
        <h5 class="mt-4">聚类结果预览（最后一列=聚类分组）</h5>
        <div class="table-responsive">
            <table class="table table-bordered">
                <tr>
                    {% for col in table_data[0].keys() %}<th>{{col}}</th>{% endfor %}
                </tr>
                {% for row in table_data[:50] %}
                <tr>
                    {% for val in row.values() %}<td>{{val}}</td>{% endfor %}
                </tr>
                {% endfor %}
            </table>
        </div>
    {% endif %}

<script>
// 绘制肘部曲线
{% if elbow_sse %}
let myChart = echarts.init(document.getElementById('elbowChart'));
let sse = {{elbow_sse}};
let xData = [];
for(let i=1;i<=sse.length;i++) xData.push(i);
myChart.setOption({
    title:{text:"肘部法则图（优选拐点K）"},
    xAxis:{data:xData,name:"聚类数K"},
    yAxis:{name:"SSE误差和"},
    series:[{type:"line",data:sse}]
})
{% endif %}
</script>
</body>
</html>
