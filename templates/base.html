<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}数据分析系统{% endblock %}</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 60px; }
        .navbar-brand { font-weight: bold; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">📊 数据分析系统</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">上传数据</a>
                <a class="nav-link" href="/preview">数据预览</a>
                <a class="nav-link" href="/cleaning">数据清洗</a>
                <a class="nav-link" href="/analysis">数据分析</a>
                <a class="nav-link" href="/visualize">可视化</a>
                <a class="nav-link" href="/export">导出数据</a>
                <a class="nav-link" href="/database/">数据存储</a>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
